version: '3.8'

services:
  app:
    image: tusharsahni22/officeworks:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: officeworks_workplace
    restart: unless-stopped
    ports:
      - "80:5000"
      - "5000:5000"

  watchtower:
    image: containrrr/watchtower
    container_name: officeworks_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - REPO_USER=${DOCKERHUB_USERNAME:-}
      - REPO_PASS=${DOCKERHUB_TOKEN:-}
    command: --interval 60 --cleanup officeworks_workplace
