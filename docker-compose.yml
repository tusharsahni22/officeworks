version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: product_catalogue_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_ORIGIN=http://localhost:5173,http://localhost:5174,http://localhost:80
      - MONGODB_URI=${MONGODB_URI:-}
      - FAKESTORE_API_URL=https://fakestoreapi.com
      - SALES_INBOX_EMAIL=sales@officeworks-workplace.com.au
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: product_catalogue_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

