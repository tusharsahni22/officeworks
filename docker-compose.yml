version: '3.8'

services:
  app:
    image: tusharsahni22/officeworks:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: officeworks_workplace
    restart: unless-stopped
    ports:
      - "80:5000"
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_ORIGIN=*
      - MONGODB_URI=${MONGODB_URI:-}
      - FAKESTORE_API_URL=https://fakestoreapi.com
      - SALES_INBOX_EMAIL=sales@officeworks-workplace.com.au
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - CONTENTFUL_SPACE_ID=${CONTENTFUL_SPACE_ID:-}
      - CONTENTFUL_ACCESS_TOKEN=${CONTENTFUL_ACCESS_TOKEN:-}
      - CONTENTFUL_ENVIRONMENT=${CONTENTFUL_ENVIRONMENT:-master}
      - CONTENTFUL_MANAGEMENT_TOKEN=${CONTENTFUL_MANAGEMENT_TOKEN:-}

  watchtower:
    image: containrrr/watchtower
    container_name: officeworks_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - REPO_USER=${DOCKERHUB_USERNAME:-}
      - REPO_PASS=${DOCKERHUB_TOKEN:-}
    command: --interval 60 --cleanup officeworks_workplace
