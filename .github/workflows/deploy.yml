name: CI/CD Pipeline - Build and Push

on:
  push:
    branches:
      - main
      - qa
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Determine Docker Tag
        id: determine_tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TAG=latest" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "TAG=qa" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "TAG=dev" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Generate server .env file
        run: |
          echo "PORT=5000" >> server/.env
          echo "NODE_ENV=production" >> server/.env
          echo "CLIENT_ORIGIN=${{ secrets.CLIENT_ORIGIN || '*' }}" >> server/.env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> server/.env
          echo "FAKESTORE_API_URL=${{ secrets.FAKESTORE_API_URL || 'https://fakestoreapi.com' }}" >> server/.env
          echo "SALES_INBOX_EMAIL=${{ secrets.SALES_INBOX_EMAIL || 'sales@officeworks-workplace.com.au' }}" >> server/.env
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> server/.env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}" >> server/.env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> server/.env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> server/.env
          echo "SMTP_SECURE=${{ secrets.SMTP_SECURE || 'false' }}" >> server/.env

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: tusharsahni22/officeworks-backend:${{ env.TAG }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: tusharsahni22/officeworks-frontend:${{ env.TAG }}
